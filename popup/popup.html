<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="head">
        <img src="../icons/icon-96.png" alt="" width="32" height="32">
        <div>
            <h1>Scope</h1>
            <p class="status" id="status">
                <span class="dot"></span>
                <span id="site">…</span>
            </p>
        </div>
    </header>

    <div class="card">
        <label class="row" id="site-setting">
            <span class="row-text">
                <span class="row-title">Run on this site</span>
                <span class="row-desc" id="site-desc"></span>
            </span>
            <input type="checkbox" role="switch" class="switch" id="enabled" disabled>
        </label>
    </div>

    <div class="card">
        <label class="row">
            <span class="row-text">
                <span class="row-title">Always ready</span>
                <span class="row-desc" id="start-hint"></span>
            </span>
            <input type="checkbox" role="switch" class="switch" id="always-ready">
        </label>
        <label class="row">
            <span class="row-text">
                <span class="row-title">Show default values</span>
                <span class="row-desc">Include rows left at their initial value</span>
            </span>
            <input type="checkbox" role="switch" class="switch" id="show-defaults">
        </label>
    </div>

    <details class="card" id="rows">
        <summary>
            <span class="row-text">
                <span class="row-title">Tooltip rows</span>
                <span class="row-desc" id="rows-count"></span>
            </span>
        </summary>
        <div class="panel">
            <div class="bulk">
                <button type="button" id="show-all">Show all</button>
                <button type="button" id="hide-all">Hide all</button>
            </div>
            <div id="properties"></div>
        </div>
    </details>

    <script src="../shared/browser.js"></script>
    <script src="../content/properties.js"></script>
    <script src="../background/injection.js"></script>
    <script src="popup.js"></script>
</body>
</html>
