<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff;
            --fg: #15141a;
            --muted: #5b5b66;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2b2a33;
                --fg: #fbfbfe;
                --muted: #bfbfc9;
            }
        }

        body {
            margin: 0;
            padding: 12px 14px;
            min-width: 220px;
            background: var(--bg);
            color: var(--fg);
            font: 13px/1.4 system-ui, sans-serif;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        hr {
            margin: 10px 0;
            border: none;
            border-top: 1px solid var(--muted);
            opacity: 0.4;
        }

        #site {
            margin-top: 4px;
            color: var(--muted);
            font-family: monospace;
            word-break: break-all;
        }

        summary {
            cursor: pointer;
        }

        #bulk {
            margin-top: 6px;
            color: var(--muted);
        }

        /* Text links rather than buttons, so they don't outweigh the
           checkboxes. */
        #bulk button {
            padding: 0;
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            text-decoration: underline;
            cursor: pointer;
        }

        #bulk button:hover {
            color: var(--fg);
        }

        #properties {
            display: grid;
            grid-template-columns: auto auto;
            gap: 8px 16px;
            margin-top: 8px;
        }

        fieldset {
            margin: 0;
            padding: 0;
            border: none;
        }

        legend {
            padding: 0;
            margin-bottom: 2px;
            color: var(--muted);
        }

        #properties label {
            font-family: monospace;
        }

        .unavailable #site-setting {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
    <label>
        <input type="checkbox" id="show-defaults">
        Show default values
    </label>

    <details>
        <summary>Shown properties</summary>
        <div id="bulk">
            Show
            <button type="button" id="show-all">all</button>
            ·
            <button type="button" id="hide-all">none</button>
        </div>
        <div id="properties"></div>
    </details>

    <hr>

    <label id="site-setting">
        <input type="checkbox" id="disabled" disabled>
        Disable on this site
    </label>
    <div id="site"></div>

    <script src="../content/properties.js"></script>
    <script src="popup.js"></script>
</body>
</html>
