<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff;
            --fg: #15141a;
            --muted: #5b5b66;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2b2a33;
                --fg: #fbfbfe;
                --muted: #bfbfc9;
            }
        }

        body {
            margin: 0;
            padding: 12px 14px;
            min-width: 220px;
            background: var(--bg);
            color: var(--fg);
            font: 13px/1.4 system-ui, sans-serif;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        #site {
            margin-top: 4px;
            color: var(--muted);
            font-family: monospace;
            word-break: break-all;
        }

        .unavailable label {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>
<body>
    <label>
        <input type="checkbox" id="disabled" disabled>
        Disable on this site
    </label>
    <div id="site"></div>

    <script src="popup.js"></script>
</body>
</html>
