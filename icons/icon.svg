<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Navy tile -->
  <rect width="96" height="96" rx="22" fill="#10264d"/>

  <!-- Scope: ring with crosshair ticks -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <circle cx="42" cy="42" r="26"/>
    <path d="M42 10v12M42 62v12M10 42h12M62 42h12"/>
  </g>

  <!-- Eye in the center -->
  <path d="M27 42q15-15 30 0q-15 15-30 0z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="42" cy="42" r="5.5" fill="#fff"/>

  <!-- Orange pointer, outlined in navy so it separates from the ring -->
  <path d="M51 51l40 15-17 5-5 17z" fill="#f7931e" stroke="#10264d" stroke-width="4" stroke-linejoin="round"/>
</svg>
